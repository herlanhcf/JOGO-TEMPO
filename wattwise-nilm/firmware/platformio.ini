; WattWise — ESP32-S3 NILM energy monitor
[platformio]
default_envs = wattwise-s3

[env:wattwise-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8 (16MB flash, 8MB octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    knolleary/PubSubClient@^2.8         ; MQTT
    bblanchon/ArduinoJson@^7            ; config / discovery
    adafruit/RTClib@^2.1                ; DS3231
    ; espressif/esp-dsp                 ; FFT otimizada (via IDF component)
    ; tensorflow/tflite-micro           ; adicionar ao embarcar o modelo
